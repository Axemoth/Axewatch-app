name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode uses the full main-branch commit count

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Restore stable release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64" || { echo 'ANDROID_SIGNING_KEY_BASE64 is required'; exit 1; }
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/axewatch-update.jks"

      - name: Build updatable release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/axewatch-update.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify update signature and version
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          cert_digest=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert_digest" = 'f89947b16e54cbc7bad9076f4f574dfb294659be494a210f8050a0ca768122d6' || {
            echo 'Release certificate does not match the installed Axewatch APK'; exit 1;
          }
          version_code=$("$aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          test "$version_code" -gt 1 || { echo 'Release versionCode must exceed the first distributed APK'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Axewatch-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
